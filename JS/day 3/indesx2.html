<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Image Slider</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
    }
    .slider {
      position: relative;
      width: 500px;
      height: 300px;
      overflow: hidden;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .slider img.active {
      display: block;
    }
    .controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }
    button {
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

<div class="slider" id="slider">
  <img src="img/533100175_744940308324259_3727864041350195055_n.jpg" class="active">
  <img src="img/ChatGPT Image Sep 17, 2025, 04_04_39 PM.png">
  <img src="img/images (4).jpeg">

  <div class="controls">
    <button id="prev">❮</button>
    <button id="next">❯</button>
  </div>
</div>

<script>
  const slider = document.getElementById('slider');
  const images = slider.querySelectorAll('img');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let index = 0;
  let interval;

  function showImage(i) {
    images.forEach(img => img.classList.remove('active'));
    images[i].classList.add('active');
  }

  function startSlide() {
    interval = setInterval(() => {
      index = (index + 1) % images.length;
      showImage(index);
    }, 2000);
  }

  function stopSlide() {
    clearInterval(interval);
  }

  prev.addEventListener('click', () => {
    index = (index - 1 + images.length) % images.length;
    showImage(index);
  });

  next.addEventListener('click', () => {
    index = (index + 1) % images.length;
    showImage(index);
  });

  slider.addEventListener('mouseenter', stopSlide);
  slider.addEventListener('mouseleave', startSlide);

  startSlide();
</script>

</body>
</html>
