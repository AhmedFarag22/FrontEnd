<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    form {
      margin-bottom: 20px;
    }
    input {
      margin: 5px 0;
      display: block;
      padding: 8px;
      width: 250px;
    }
    .error {
      color: red;
      font-size: 14px;
    }
    table {
      border-collapse: collapse;
      width: 80%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Add Student</h2>
  <form id="studentForm">
    <label>Name:</label>
    <input type="text" id="name" required>
    <div id="nameError" class="error"></div>

    <label>Age:</label>
    <input type="number" id="age" required>
    <div id="ageError" class="error"></div>

    <label>Email:</label>
    <input type="email" id="email" required>
    <div id="emailError" class="error"></div>

    <label>Password:</label>
    <input type="password" id="password" required>
    <div id="passwordError" class="error"></div>

    <button type="submit">Add Student</button>
  </form>

  <h2>Students List</h2>
  <table id="studentTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById("studentForm");
    const tableBody = document.querySelector("#studentTable tbody");

    // Load data from localStorage when page opens
    document.addEventListener("DOMContentLoaded", loadStudents);

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      // Get values
      const name = document.getElementById("name").value.trim();
      const age = parseInt(document.getElementById("age").value);
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Error fields
      const nameError = document.getElementById("nameError");
      const ageError = document.getElementById("ageError");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");

      // Reset errors
      nameError.textContent = "";
      ageError.textContent = "";
      emailError.textContent = "";
      passwordError.textContent = "";

      // Validation
      let valid = true;

      if (name.length < 3) {
        nameError.textContent = "Name must be at least 3 characters.";
        valid = false;
      }

      if (isNaN(age) || age <= 18) {
        ageError.textContent = "Age must be greater than 18.";
        valid = false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email.";
        valid = false;
      }

      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{5,}$/;
      if (!passwordPattern.test(password)) {
        passwordError.textContent = "Password must contain uppercase, lowercase, number and be at least 5 characters.";
        valid = false;
      }

      if (!valid) return;

      // Save student
      const student = { name, age, email };
      addStudent(student);

      // Save to localStorage
      let students = JSON.parse(localStorage.getItem("students")) || [];
      students.push(student);
      localStorage.setItem("students", JSON.stringify(students));

      // Reset form
      form.reset();
    });

    function addStudent(student) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${student.name}</td>
        <td>${student.age}</td>
        <td>${student.email}</td>
      `;
      tableBody.appendChild(row);
    }

    function loadStudents() {
      const students = JSON.parse(localStorage.getItem("students")) || [];
      students.forEach(addStudent);
    }
  </script>

</body>
</html>
